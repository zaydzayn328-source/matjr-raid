<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تفاصيل المنتج | Zero Market</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ============ Header المتجر (مطابق لصفحة المتجر) ============ -->
<header class="store-header">

    <!-- هوية المتجر -->
    <a href="project3.html" class="store-logo">Zero Market</a>

    <!-- السلة -->
    <button type="button" class="cart-btn" aria-label="سلة المشتريات">
        &#128722; السلة
    </button>

</header>

<!-- ============ شريط التنقل الموحد للمتجر ============ -->
<div class="store-nav">
    <a href="project3.html">الرئيسية</a>
    <a href="store-view.html?view=all">منتجاتنا</a>
    <a href="store-view.html?view=offers">العروض</a>
    <a href="store-view.html?view=best-sellers">⭐ الأعلى تقييمًا</a>
    <a href="store-view.html?view=new-arrivals">جديدنا</a>
    <a href="project3.html#categories">التصنيفات</a>
    <a href="project3.html#contact">تواصل معنا</a>
</div>

<!-- ============ البحث في المتجر ============ -->
<form class="store-search" action="store-view.html" method="get" role="search">
    <input type="search" name="q" placeholder="ابحث عن منتج... مثال: هاتف، عطر، حقيبة" aria-label="ابحث عن منتج" required>
    <button type="submit">🔍 بحث</button>
</form>

<!-- ============ منطقة تفاصيل المنتج (تُعبأ من script.js حسب ?id=) ============ -->
<section class="product-detail-page">

    <div class="product-detail-container" id="product-detail-container">
        <!-- يُبنى المحتوى ديناميكيًا من script.js -->
    </div>

</section>

<script src="store-config.js"></script>
<script src="script.js"></script>

</body>

</html>
